[package]
name = "rinse"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel-packet-processing"]
parallel-packet-processing = ["dep:rayon"]
tcp = ["tokio/io-util", "tokio/net"]
config = ["dep:toml"]
relay = ["config", "dep:serde_json", "dep:simplelog", "dep:ratatui", "dep:crossterm", "tokio/fs", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal", "tokio/time"]

[dependencies]
aes = "0.8.4"
async-channel = "2"
cbc = { version = "0.1.2", features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12.4"
hmac = "0.12.1"
log = "0.4"
rand = "0.8"
rmp-serde = "1.3"
rmpv = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
bzip2 = "0.5"
embassy-time = { version = "0.5", features = ["generic-queue-64", "std"] }
futures-lite = "2"
rayon = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
env_logger = "0.11"
toml = { version = "0.8", optional = true }

# Relay dependencies
serde_json = { version = "1.0", optional = true }
simplelog = { version = "0.12", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[target.'cfg(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(not(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
sha2 = "0.10.9"

[[bin]]
name = "rinse-relay"
path = "src/bin/relay.rs"
required-features = ["relay", "tcp"]

[[example]]
name = "serve"
required-features = ["config", "tcp"]

[[example]]
name = "request"
required-features = ["config", "tcp"]

[[example]]
name = "page"
required-features = ["config", "tcp"]

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
