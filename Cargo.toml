[package]
name = "rinse"
version = "0.1.0"
edition = "2024"
autoexamples = false
autobins = false

[features]
default = []
embassy-clock = ["dep:embassy-time"]
std-clock = ["embassy-clock", "embassy-time/std", "embassy-time/generic-queue-64"]
tcp = ["dep:socket2", "dep:tokio", "tokio/io-util", "tokio/net"]
config = ["dep:toml"]
relay = ["std-clock", "tcp", "config", "dep:env_logger", "dep:serde_json", "dep:simplelog", "dep:ratatui", "dep:crossterm", "tokio/fs", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal", "tokio/time"]

[dependencies]
aes = "0.8.4"
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
cbc = { version = "0.1.2", features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12.4"
hmac = "0.12.1"
log = "0.4"
rand = "0.8"
rand_core = { version = "0.6.4", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
rmp-serde = "1.3"
rmpv = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.1", default-features = false }
bzip2 = "0.5"
bytes = { version = "1.10.1", default-features = false, features = ["std"] }
embassy-time = { version = "0.5", optional = true }
futures-channel = { version = "0.3.33", default-features = false, features = ["std"] }
futures-core = { version = "0.3.33", default-features = false, features = ["std"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await", "async-await-macro"] }
tokio = { version = "1", default-features = false, optional = true }
socket2 = { version = "0.6", optional = true }
env_logger = { version = "0.11", optional = true }
toml = { version = "0.8", optional = true }

# Relay dependencies
serde_json = { version = "1.0", optional = true }
simplelog = { version = "0.12", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }

[target.'cfg(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(not(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
sha2 = "0.10.9"

[[bin]]
name = "rinse-relay"
path = "src/bin/relay.rs"
required-features = ["relay", "tcp"]

[[example]]
name = "serve"
required-features = ["config", "tcp", "std-clock"]

[[example]]
name = "request"
required-features = ["config", "tcp", "std-clock"]

[[example]]
name = "page"
required-features = ["config", "tcp", "std-clock"]

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
